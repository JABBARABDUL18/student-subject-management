<div class="container">

  <h1>Student Registration</h1>

  <form (ngSubmit)="addStudent()">

    <label>Name</label>
    <input
      type="text"
      [(ngModel)]="student.name"
      name="name"
      required
    />

    <label>Email</label>
    <input
      type="email"
      [(ngModel)]="student.email"
      name="email"
      required
    />

    <label>Course</label>
    <input
      type="text"
      [(ngModel)]="student.course"
      name="course"
      required
    />

    <label>Phone</label>
    <input
      type="text"
      [(ngModel)]="student.phone"
      name="phone"
      required
    />

    <button type="submit">
      {{ isEditMode ? 'Update Student' : 'Add Student' }}
    </button>

  </form>

  <h2>Student List</h2>

  <table>

    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Course</th>
        <th>Phone</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let s of students">

        <td>{{ s.id }}</td>
        <td>{{ s.name }}</td>
        <td>{{ s.email }}</td>
        <td>{{ s.course }}</td>
        <td>{{ s.phone }}</td>

        <td>
          <button
            type="button"
            (click)="editStudent(s)">
            Edit
          </button>

          <button
            type="button"
            (click)="deleteStudent(s.id!)">
            Delete
          </button>
        </td>

      </tr>

    </tbody>

  </table>

</div>
